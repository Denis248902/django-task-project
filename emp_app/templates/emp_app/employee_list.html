{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h1>{{ page_title }}</h1>

<div class="cards-grid">
  {% for employee in employees %}
  <div class="card">
    <h3>{{ employee.full_name }}</h3>
    <p><strong>Должность:</strong> {{ employee.position|default:"Не указана" }}</p>
    <a href="{% url 'employee_detail' employee.pk %}" class="btn">Подробнее</a>
  </div>
  {% empty %}
  <p>Нет сотрудников.</p>
  {% endfor %}
</div>
{% endblock %}
