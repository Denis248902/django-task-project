<!DOCTYPE html>
<html>
<head><title>Главная</title></head>
<body>
  <h1>Сотрудники</h1>
  {% for p in profiles %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
      <h3>{{ p.first_name }} {{ p.last_name }}</h3>
      <p>Пол: {{ p.get_gender_display }}</p>
      <a href="{% url 'employee_detail' p.pk %}">Подробнее</a>
    </div>
  {% empty %}
    Нет сотрудников.
  {% endfor %}
</body>
</html>
