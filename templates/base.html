<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Сотрудники{% endblock %}</title>
    {% load static %}
</head>
<body>
    <nav>
        <a href="{% url 'employees:home' %}">Главная</a> |
        <a href="{% url 'employees:employee_list' %}">Список сотрудников</a>
        {% if user.is_authenticated %}
            | Привет, {{ user.username }}
        {% else %}
            | <a href="/login/">Войти</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
