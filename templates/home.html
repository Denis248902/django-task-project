{% extends 'base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1>Наши сотрудники</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
  {% for emp in employees %}
  <div style="border:1px solid #ccc; padding:12px; border-radius:8px;">
    <h3>{{ emp.full_name }}</h3>
    <p>{{ emp.position|default:"Без должности" }}</p>
    <a href="{% url 'employees:employee_detail' emp.pk %}">Подробнее</a>
  </div>
  {% empty %}
  <p>Нет сотрудников.</p>
  {% endfor %}
</div>
{% endblock %}
