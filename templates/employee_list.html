{% extends 'base.html' %}
{% block title %}Список сотрудников{% endblock %}
{% block content %}
<h1>Все сотрудники</h1>
<ul>
  {% for emp in employees %}
  <li>
    <a href="{% url 'employees:employee_detail' emp.pk %}">{{ emp.full_name }} ({{ emp.position }})</a>
  </li>
  {% empty %}
  <li>Нет сотрудников.</li>
  {% endfor %}
</ul>
{% endblock %}
